services:
  app:
    image: ${CIVICRM_IMAGE:-civicrm/civicrm:6.16-php8.3}
    hostname: civicfg-qa-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CIVICRM_HTTP_PORT:-8760}:80"
    environment:
      CIVICRM_DB_HOST: db
      CIVICRM_DB_PORT: 3306
      CIVICRM_DB_NAME: civicrm
      CIVICRM_DB_USER: civicrm
      CIVICRM_DB_PASSWORD: ${MYSQL_PASSWORD:-civicfg-qa-password}
      CIVICRM_UF_BASEURL: http://127.0.0.1:${CIVICRM_HTTP_PORT:-8760}
      CIVICFG_QA_RUN_ID: ${CIVICFG_QA_RUN_ID:-local}
      CIVICFG_QA_ROOT: /tmp/civicfg-qa
      CIVICFG_QA_ARTIFACTS: /qa-artifacts
    volumes:
      - private:/var/www/html/private
      - public:/var/www/html/public
      - type: bind
        source: ${EXTENSION_ROOT}
        target: /var/www/html/ext/civi.config.manager
        read_only: true
      - type: bind
        source: ${QA_ARTIFACT_DIR}
        target: /qa-artifacts
      - type: bind
        source: ${FIXTURE_EXTENSION_DIR}
        target: /var/www/html/ext-fixtures
        read_only: true
      - type: bind
        source: ${PHP_QA_INI}
        target: /usr/local/etc/php/conf.d/99-civicfg-qa.ini
        read_only: true
      - type: bind
        source: ${EXTENSION_ROOT}/tests/ci/sendmail-blocker.sh
        target: /usr/local/bin/civicfg-sendmail-blocker
        read_only: true
    networks:
      - isolated

  db:
    image: mariadb:10.11
    hostname: civicfg-qa-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-civicfg-qa-root-password}
      MYSQL_DATABASE: civicrm
      MYSQL_USER: civicrm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-civicfg-qa-password}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - isolated

  mailpit:
    image: axllent/mailpit:v1.30.4
    hostname: civicfg-qa-mailpit
    command: ["--max-messages", "100"]
    networks:
      - isolated

volumes:
  private:
  public:
  db:

networks:
  isolated:
    driver: bridge
