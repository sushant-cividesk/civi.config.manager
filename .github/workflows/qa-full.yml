name: QA - Full CiviCRM Extension

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      civicrm_image:
        description: CiviCRM Docker image
        required: true
        default: civicrm/civicrm:6.16-php8.3
      run_ui_tests:
        description: Run Playwright UI tests
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

jobs:
  full:
    name: Full isolated CiviCRM QA
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      COMPOSER_PROCESS_TIMEOUT: 0
      COMPOSER_NO_INTERACTION: 1
      COMPOSER_NO_AUDIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, intl, json
          tools: composer
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Required fast QA gate
        run: composer qa:fast

      - name: Required metadata hook unit coverage
        run: composer test:hook

      - name: Required CLI wrapper unit coverage
        run: composer test:cli

      - name: Install browser dependencies
        if: ${{ github.event_name == 'pull_request' || inputs.run_ui_tests == 'true' }}
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run full isolated CiviCRM QA with browser tests
        if: ${{ github.event_name == 'pull_request' || inputs.run_ui_tests == 'true' }}
        env:
          CIVICRM_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.civicrm_image || 'civicrm/civicrm:6.16-php8.3' }}
        run: composer qa:browser

      - name: Run full isolated CiviCRM QA without browser tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests != 'true' }}
        env:
          CIVICRM_IMAGE: ${{ inputs.civicrm_image }}
        run: composer qa:real-runtime

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civicfg-qa-artifacts
          path: tests/ci/artifacts
