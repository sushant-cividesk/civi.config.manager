name: QA - Fast

on:
  push:
  pull_request:

jobs:
  fast:
    name: PHP ${{ matrix.php }} fast QA
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, intl, json
          tools: composer
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Fast QA
        run: composer qa:fast

      - name: Composer security audit
        run: composer audit

      - name: Coding standards advisory
        run: composer standards
        continue-on-error: true

      - name: PHP 8.1 compatibility advisory
        run: composer compatibility
        continue-on-error: true
