name: QA - Fast

on:
  push:
  pull_request:

jobs:
  fast:
    name: PHP ${{ matrix.php }} fast QA
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']

    env:
      COMPOSER_PROCESS_TIMEOUT: 0
      COMPOSER_NO_INTERACTION: 1
      COMPOSER_NO_AUDIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, intl, json
          tools: composer
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Required fast QA
        run: composer qa:fast

      - name: Required metadata hook unit coverage
        run: composer test:hook

      - name: Required CLI wrapper unit coverage
        run: composer test:cli

      - name: Required security audit
        run: composer audit
