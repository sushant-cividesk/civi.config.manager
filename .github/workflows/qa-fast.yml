name: QA - Fast

on:
  push:
  pull_request:

jobs:
  fast:
    name: PHP ${{ matrix.php }} fast QA
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    env:
      COMPOSER_PROCESS_TIMEOUT: 0
      COMPOSER_NO_INTERACTION: 1
      COMPOSER_NO_AUDIT: 1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, zip, intl, json
          tools: composer
          coverage: none

      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Required fast QA
        run: composer qa:fast

      - name: Required security audit
        run: composer audit

      - name: Advisory coding standards
        run: composer standards || true
        continue-on-error: true

      - name: Advisory PHP compatibility
        run: composer compatibility || true
        continue-on-error: true
